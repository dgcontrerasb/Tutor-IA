# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Redirecciones SPA (Single Page Application)
# Permite que las rutas de React / Vite funcionen correctamente en recargas y navegación directa
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad y caché optimizada para producción
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
